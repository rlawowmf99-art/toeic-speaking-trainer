<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Speaking Lab · mobile preview (390)</title>
<style>
  html,body{margin:0;padding:0;background:#E7ECF1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .stage{display:flex;align-items:flex-start;gap:28px;padding:32px}
  .phone{width:390px;height:844px;border:0;background:#fff;box-shadow:0 24px 60px -30px rgba(14,34,61,.55);border-radius:2px}
  .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5C7189;padding-top:8px}
</style>
</head>
<body>
<div class="stage">
  <div>
    <iframe class="phone" id="phone" src="preview.html?v=6" scrolling="no"></iframe>
    <div class="cap">390 × 844</div>
  </div>
</div>
<script>
  (function () {
    var y = parseInt((location.search.match(/[?&]y=(\d+)/) || [0, 0])[1], 10) || 0;
    var f = document.getElementById('phone');
    f.addEventListener('load', function () {
      try { f.contentWindow.scrollTo(0, y); } catch (e) {}
    });
  })();
</script>
</body>
</html>
